name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/openrgbdevelopers/openrgb-linux-ci-deb-builder:bookworm-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Git Config Safe Directory
        run: git config --global --add safe.directory '*'
      - name: Build
        run: |
          qmake6 OpenRGBNeuroLavaLampPlugin.pro
          make -j$(nproc)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libOpenRGBNeuroLavaLampPlugin_Linux_amd64.so
          path: ./libOpenRGBNeuroLavaLampPlugin.so

  build-windows-64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.2'
          arch: 'win64_msvc2019_64'
      - name: Build
        run: |
          qmake6 OpenRGBNeuroLavaLampPlugin.pro
          nmake
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBNeuroLavaLampPlugin_Windows_64.dll
          path: release/OpenRGBNeuroLavaLampPlugin.dll


  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install Qt via Brew
        run: |
          brew install qt@6
      - name: Build
        run: |
          eval $(/opt/homebrew/bin/brew shellenv)
          export PATH="/opt/homebrew/opt/qt@6/bin:$PATH"
          qmake6 OpenRGBNeuroLavaLampPlugin.pro
          make -j$(sysctl -n hw.ncpu)
          install_name_tool libOpenRGBNeuroLavaLampPlugin.dylib -change /opt/homebrew/opt/qt@6/lib/QtWidgets.framework/Versions/A/QtWidgets @executable_path/../Frameworks/QtWidgets.framework/Versions/A/QtWidgets
          install_name_tool libOpenRGBNeuroLavaLampPlugin.dylib -change /opt/homebrew/opt/qt@6/lib/QtGui.framework/Versions/A/QtGui @executable_path/../Frameworks/QtGui.framework/Versions/A/QtGui
          install_name_tool libOpenRGBNeuroLavaLampPlugin.dylib -change /opt/homebrew/opt/qt@6/lib/QtCore.framework/Versions/A/QtCore @executable_path/../Frameworks/QtCore.framework/Versions/A/QtCore
          codesign --force --verify -s - libOpenRGBNeuroLavaLampPlugin.dylib
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libOpenRGBNeuroLavaLampPlugin_MacOS_ARM64.dylib
          path: libOpenRGBNeuroLavaLampPlugin.dylib

  release:
    needs: [build-linux-amd64, build-windows-64, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mkdir release-files
          cp artifacts/libOpenRGBNeuroLavaLampPlugin_Linux_amd64.so/libOpenRGBNeuroLavaLampPlugin.so release-files/libOpenRGBNeuroLavaLampPlugin_Linux_amd64.so || true
          cp artifacts/OpenRGBNeuroLavaLampPlugin_Windows_64.dll/OpenRGBNeuroLavaLampPlugin.dll release-files/OpenRGBNeuroLavaLampPlugin_Windows_64.dll || true
          cp artifacts/libOpenRGBNeuroLavaLampPlugin_MacOS_ARM64.dylib/libOpenRGBNeuroLavaLampPlugin.dylib release-files/libOpenRGBNeuroLavaLampPlugin_MacOS_ARM64.dylib || true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          draft: false
          prerelease: false
