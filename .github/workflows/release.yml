name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/openrgbdevelopers/openrgb-linux-ci-deb-builder:bookworm-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: |
          qmake OpenRGBNeuroLavaLampPlugin.pro
          make -j$(nproc)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libOpenRGBNeuroLavaLampPlugin_Linux_amd64.so
          path: ./libOpenRGBNeuroLavaLampPlugin.so

  build-windows-64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
      - name: Build
        run: |
          qmake OpenRGBNeuroLavaLampPlugin.pro
          nmake
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBNeuroLavaLampPlugin_Windows_64.dll
          path: release/OpenRGBNeuroLavaLampPlugin.dll

  build-windows-32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSVC environment (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win32_msvc2019'
      - name: Build
        run: |
          qmake OpenRGBNeuroLavaLampPlugin.pro
          nmake
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBNeuroLavaLampPlugin_Windows_32.dll
          path: release/OpenRGBNeuroLavaLampPlugin.dll

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt via Brew
        run: |
          brew install qt@5
      - name: Build
        run: |
          eval $(/opt/homebrew/bin/brew shellenv)
          export PATH="/opt/homebrew/opt/qt@5/bin:$PATH"
          qmake OpenRGBNeuroLavaLampPlugin.pro
          make -j$(sysctl -n hw.ncpu)
          install_name_tool libOpenRGBNeuroLavaLampPlugin.dylib -change /opt/homebrew/opt/qt@5/lib/QtWidgets.framework/Versions/5/QtWidgets @executable_path/../Frameworks/QtWidgets.framework/Versions/5/QtWidgets
          install_name_tool libOpenRGBNeuroLavaLampPlugin.dylib -change /opt/homebrew/opt/qt@5/lib/QtGui.framework/Versions/5/QtGui @executable_path/../Frameworks/QtGui.framework/Versions/5/QtGui
          install_name_tool libOpenRGBNeuroLavaLampPlugin.dylib -change /opt/homebrew/opt/qt@5/lib/QtCore.framework/Versions/5/QtCore @executable_path/../Frameworks/QtCore.framework/Versions/5/QtCore
          codesign --force --verify -s - libOpenRGBNeuroLavaLampPlugin.dylib
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libOpenRGBNeuroLavaLampPlugin_MacOS_ARM64.dylib
          path: libOpenRGBNeuroLavaLampPlugin.dylib

  build-macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt via Brew
        run: |
          brew install qt@5
      - name: Build
        run: |
          eval $(/usr/local/bin/brew shellenv)
          export PATH="/usr/local/opt/qt@5/bin:$PATH"
          arch -x86_64 qmake OpenRGBNeuroLavaLampPlugin.pro
          arch -x86_64 make -j$(sysctl -n hw.ncpu)
          arch -x86_64 install_name_tool libOpenRGBNeuroLavaLampPlugin.dylib -change /usr/local/opt/qt@5/lib/QtWidgets.framework/Versions/5/QtWidgets @executable_path/../Frameworks/QtWidgets.framework/Versions/5/QtWidgets
          arch -x86_64 install_name_tool libOpenRGBNeuroLavaLampPlugin.dylib -change /usr/local/opt/qt@5/lib/QtGui.framework/Versions/5/QtGui @executable_path/../Frameworks/QtGui.framework/Versions/5/QtGui
          arch -x86_64 install_name_tool libOpenRGBNeuroLavaLampPlugin.dylib -change /usr/local/opt/qt@5/lib/QtCore.framework/Versions/5/QtCore @executable_path/../Frameworks/QtCore.framework/Versions/5/QtCore
          arch -x86_64 codesign --force --verify -s - libOpenRGBNeuroLavaLampPlugin.dylib
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libOpenRGBNeuroLavaLampPlugin_MacOS_Intel.dylib
          path: libOpenRGBNeuroLavaLampPlugin.dylib

  release:
    needs: [build-linux-amd64, build-windows-64, build-windows-32, build-macos-arm64, build-macos-intel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mkdir release-files
          cp artifacts/libOpenRGBNeuroLavaLampPlugin_Linux_amd64.so/libOpenRGBNeuroLavaLampPlugin.so release-files/libOpenRGBNeuroLavaLampPlugin_Linux_amd64.so || true
          cp artifacts/OpenRGBNeuroLavaLampPlugin_Windows_64.dll/OpenRGBNeuroLavaLampPlugin.dll release-files/OpenRGBNeuroLavaLampPlugin_Windows_64.dll || true
          cp artifacts/OpenRGBNeuroLavaLampPlugin_Windows_32.dll/OpenRGBNeuroLavaLampPlugin.dll release-files/OpenRGBNeuroLavaLampPlugin_Windows_32.dll || true
          cp artifacts/libOpenRGBNeuroLavaLampPlugin_MacOS_ARM64.dylib/libOpenRGBNeuroLavaLampPlugin.dylib release-files/libOpenRGBNeuroLavaLampPlugin_MacOS_ARM64.dylib || true
          cp artifacts/libOpenRGBNeuroLavaLampPlugin_MacOS_Intel.dylib/libOpenRGBNeuroLavaLampPlugin.dylib release-files/libOpenRGBNeuroLavaLampPlugin_MacOS_Intel.dylib || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*
          draft: false
          prerelease: false
